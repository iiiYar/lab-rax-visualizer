services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # named volume: saved-builds.json survives `docker compose down`,
      # image rebuilds and host reboots.
      - rax-data:/data
    environment:
      - DATA_DIR=/data
      - PORT=5173
    restart: unless-stopped

volumes:
  rax-data:
